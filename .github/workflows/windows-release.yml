name: Windows Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --windowed --name GradusFlasher src\m5_flasher\main.py

      - name: Archive Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path dist\GradusFlasher\* -DestinationPath GradusFlasher-windows-${{ github.ref_name }}.zip

      - name: Build Windows installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
        with:
          path: windows-installer.iss

      - name: Rename installer artifact
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          Move-Item -Path "dist\GradusFlasher-Setup-v$version.exe" -Destination "GradusFlasher-Setup-${{ github.ref_name }}.exe"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GradusFlasher-windows-${{ github.ref_name }}
          path: |
            GradusFlasher-windows-${{ github.ref_name }}.zip
            GradusFlasher-Setup-${{ github.ref_name }}.exe

      - name: Upload asset to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GradusFlasher-windows-${{ github.ref_name }}.zip
            GradusFlasher-Setup-${{ github.ref_name }}.exe
