[project]
name = "m5-flasher"
version = "0.1.0"
description = "Desktop flasher for M5Stick devices"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8",
  "pyserial>=3.5",
  "esptool>=5.2.0",
]

[project.scripts]
m5-flasher = "m5_flasher.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
